[server]
enableStaticServing = true

[[theme.fontFaces]]
family = "CitrusRoboto"
url = "app/static/fonts/RobotoVariable-Latin.woff2"
weight = "100 900"
style = "normal"

[[theme.fontFaces]]
family = "CitrusNotoSansSC"
url = "app/static/fonts/NotoSansSC-VF.ttf"
weight = "100 900"
style = "normal"

[theme]
base = "light"
primaryColor = "#111111"
backgroundColor = "#FCFCFC"
secondaryBackgroundColor = "#F7F7F7"
textColor = "#111111"
font = "CitrusRoboto, MiSans VF, CitrusNotoSansSC, sans-serif"
headingFont = "CitrusRoboto, MiSans VF, CitrusNotoSansSC, sans-serif"
baseFontSize = 15
baseFontWeight = 330
baseRadius = "10px"
buttonRadius = "10px"
borderColor = "#E9E9EA"
dataframeBorderColor = "#E9E9EA"
dataframeHeaderBackgroundColor = "#F7F7F7"
showWidgetBorder = true
showSidebarBorder = true

[theme.sidebar]
backgroundColor = "#F9F9F9"
secondaryBackgroundColor = "#F6F6F7"
textColor = "#111111"
