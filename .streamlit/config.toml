[server]
enableStaticServing = true

[[theme.fontFaces]]
family = "CitrusMiSansSemibold"
url = "app/static/fonts/MiSans-Semibold.ttf"
weight = "520"
style = "normal"

[theme]
base = "light"
primaryColor = "#111111"
backgroundColor = "#FCFCFC"
secondaryBackgroundColor = "#F7F7F7"
textColor = "#111111"
font = "CitrusMiSansSemibold, sans-serif"
headingFont = "CitrusMiSansSemibold, sans-serif"
codeFont = "CitrusMiSansSemibold, sans-serif"
baseFontSize = 15
baseFontWeight = 500
headingFontWeights = 500
codeFontWeight = 500
metricValueFontWeight = 500
baseRadius = "10px"
buttonRadius = "10px"
borderColor = "#E9E9EA"
dataframeBorderColor = "#E9E9EA"
dataframeHeaderBackgroundColor = "#F7F7F7"
showWidgetBorder = true
showSidebarBorder = true

[theme.sidebar]
backgroundColor = "#F9F9F9"
secondaryBackgroundColor = "#F6F6F7"
textColor = "#111111"
font = "CitrusMiSansSemibold, sans-serif"
headingFont = "CitrusMiSansSemibold, sans-serif"
codeFont = "CitrusMiSansSemibold, sans-serif"
headingFontWeights = 500
codeFontWeight = 500
